# Deploys the hosted MCP server (`stillworks mcp --http --hosted`) to a free Hugging Face Space (Docker SDK),
# so cloud builders and remote connectors can use it at https://<user>-<space>.hf.space/mcp with no setup.
#
# One-time setup:
#   1. huggingface.co → New Space → name "stillworks-mcp", SDK "Docker", hardware "CPU basic" (free), public.
#   2. huggingface.co/settings/tokens → new token with "Write" access.
#   3. GitHub → this repository → Settings → Secrets and variables → Actions:
#        secret   HF_TOKEN  = the token
#        variable HF_SPACE  = <your-hf-username>/stillworks-mcp
#   4. Actions → "Deploy hosted MCP server" → Run workflow. It also runs on every release tag.
#
# Without HF_TOKEN and HF_SPACE the job is skipped, so releases never fail because of it.
name: Deploy hosted MCP server

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: deploy-hosted-mcp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - name: Skip when the Space isn't configured
        id: configured
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN or HF_SPACE is not set: skipping (see the setup notes at the top of this workflow)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.configured.outputs.ok == 'true'

      - name: Build the Space's files
        if: steps.configured.outputs.ok == 'true'
        run: |
          mkdir -p space
          cp -r Dockerfile .dockerignore package.json package-lock.json tsconfig.json src templates integrations LICENSE space/
          cp deploy/huggingface/README.md space/README.md

      - name: Push to the Space
        if: steps.configured.outputs.ok == 'true'
        working-directory: space
        run: |
          git init -q -b main
          git config user.name "stillworks deploy"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
          user="${HF_SPACE%%/*}"
          git push -f "https://${user}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main

      - name: Wait for the server to answer
        if: steps.configured.outputs.ok == 'true'
        run: |
          host="$(echo "${HF_SPACE}" | tr '[:upper:]' '[:lower:]' | sed 's#/#-#; s#[._]#-#g').hf.space"
          echo "Space URL: https://${host}/mcp"
          for i in $(seq 1 60); do
            if curl -fsS "https://${host}/health" >/dev/null 2>&1; then
              echo "Healthy: https://${host}/mcp" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 20
          done
          echo "The Space didn't answer /health within 20 minutes. Check its build logs on huggingface.co." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
